name: Build Production Release APK

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'master' ]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - '.github/**/*.md'

permissions:
  contents: read

jobs:
  build_production:
    name: Build Signed Production APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure Release Keystore Exists
        run: |
          mkdir -p app/keystore
          if [ ! -f app/keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/keystore/release.keystore \
              -alias convx \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass convxrelease \
              -keypass convxrelease \
              -dname "CN=Convx, O=Convx, C=US"
          fi

      - name: Build Production Release APKs (FOSS & GMS)
        env:
          STORE_PASSWORD: convxrelease
          KEY_ALIAS: convx
          KEY_PASSWORD: convxrelease
        run: |
          ./gradlew assembleUniversalFossRelease assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload Production APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: convx-production-apks
          path: app/build/outputs/apk/**/release/*.apk
