name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'master' ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'docs/**'
      - '.github/**/*.md'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure Release Keystore Exists
        run: |
          mkdir -p app/keystore
          if [ ! -f app/keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/keystore/release.keystore \
              -alias convx \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass convxrelease \
              -keypass convxrelease \
              -dname "CN=Convx, O=Convx, C=US"
          fi

      - name: Build Universal FOSS Release APK
        env:
          STORE_PASSWORD: convxrelease
          KEY_ALIAS: convx
          KEY_PASSWORD: convxrelease
        run: |
          ./gradlew assembleUniversalFossRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-foss-release
          path: app/build/outputs/apk/universalFoss/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/universalFoss/release/*.apk
          generate_release_notes: true
