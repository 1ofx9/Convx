## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.

org.gradle.jvmargs=-Xmx2048m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx4096m -XX:ReservedCodeCacheSize=1024m -XX:+UseG1GC
android.useAndroidX=true
android.enableJetifier=false
org.gradle.unsafe.configuration-cache=false
android.nonTransitiveRClass=false
android.newDsl=false

# Jetifier is disabled - no need for ignorelist

# Build daemon settings
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads (fixes timeout issues with NewPipeExtractor)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=false
