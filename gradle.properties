## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Sized for modern Android builds (R8, KSP, Compose) with G1GC.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=1024m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx4096m -XX:ReservedCodeCacheSize=1024m -XX:+UseG1GC
android.useAndroidX=true
android.enableJetifier=false
org.gradle.unsafe.configuration-cache=false
android.nonTransitiveRClass=false
android.newDsl=false

# Build daemon and cache settings
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=false

org.gradle.daemon.performance.disable-logging=true
